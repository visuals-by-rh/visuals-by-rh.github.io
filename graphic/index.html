<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Graphic – Regula Huber</title>
  <meta name="description" content="Graphic design by Regula Huber: branding and print.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="../css/style.css?v=8">
  <script src="../js/main.js?v=8" defer></script>
</head>
<body>

  <header id="top" class="hero">
    <div class="topbar">
      <a href="../" class="brand"><span class="dot" aria-hidden="true"></span>Regula Huber</a>

      <nav class="nav-tab" aria-label="Main" data-i18n-aria="navLabel">
        <a href="./" class="nav-link" aria-current="page" data-i18n="graphic">Graphic</a>
        <a href="../digital/" class="nav-link" data-i18n="digital">Digital</a>
        <a href="../photo/" class="nav-link" data-i18n="photo">Photo</a>
        <a href="../video/" class="nav-link" data-i18n="video">Video</a>
        <span class="nav-sep" aria-hidden="true"></span>
        <a href="../#about" class="nav-about" data-i18n="about">About</a>
      </nav>

      <span class="break" aria-hidden="true"></span>

      <div class="lang" role="group" aria-label="Language" data-i18n-aria="langLabel">
        <button type="button" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" data-lang="de" aria-pressed="false">DE</button>
      </div>
    </div>

    <div class="page-head">
      <h1 data-i18n="graphic">Graphic</h1>
      <div class="filters" role="group" aria-label="Filter by category" data-i18n-aria="filterLabel">
        <button type="button" class="filter" data-filter="all" aria-pressed="true" data-i18n="all">All</button>
        <button type="button" class="filter" data-filter="branding" aria-pressed="false" data-i18n="branding">Branding</button>
        <button type="button" class="filter" data-filter="print" aria-pressed="false" data-i18n="print">Print</button>
      </div>
    </div>
  </header>

  <main>
    <!--
      PROJECTS: one <figure class="shot" data-tags="..."> per project, as on the Photo page.
      data-tags: one or more of  branding print  (space-separated)
    -->
    <div class="gallery">
    </div>
    <p class="gallery-empty" data-i18n="noItems" hidden>No projects in this category yet.</p>
  </main>

  <footer class="footer">
    <span>© 2026 Regula Huber</span>
    <span class="social">
      <a href="#top">Instagram</a>
      <a href="#top">Behance</a>
      <a href="#top">LinkedIn</a>
    </span>
  </footer>

</body>
</html>
