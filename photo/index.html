<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photo – Regula Huber</title>
  <meta name="description" content="Photography by Regula Huber: portraits, branding, events, weddings and sport.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="../css/style.css?v=11">
  <script src="../js/main.js?v=11" defer></script>
</head>
<body>

  <header id="top" class="hero">
    <div class="topbar">
      <a href="../" class="brand"><span class="dot" aria-hidden="true"></span>Regula Huber</a>

      <nav class="nav-tab" aria-label="Main" data-i18n-aria="navLabel">
        <a href="../graphic/" class="nav-link" data-i18n="graphic">Graphic</a>
        <a href="../digital/" class="nav-link" data-i18n="digital">Digital</a>
        <a href="./" class="nav-link" aria-current="page" data-i18n="photo">Photo</a>
        <a href="../video/" class="nav-link" data-i18n="video">Video</a>
        <span class="nav-sep" aria-hidden="true"></span>
        <a href="../#about" class="nav-about" data-i18n="about">About</a>
      </nav>

      <span class="break" aria-hidden="true"></span>

      <div class="lang" role="group" aria-label="Language" data-i18n-aria="langLabel">
        <button type="button" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" data-lang="de" aria-pressed="false">DE</button>
      </div>
    </div>

    <div class="page-head">
      <h1 data-i18n="photo">Photo</h1>
      <div class="filters" role="group" aria-label="Filter by category" data-i18n-aria="filterLabel">
        <button type="button" class="filter" data-filter="all" aria-pressed="true" data-i18n="all">All</button>
        <button type="button" class="filter" data-filter="portraits" aria-pressed="false" data-i18n="portraits">Portraits</button>
        <button type="button" class="filter" data-filter="branding" aria-pressed="false" data-i18n="branding">Branding</button>
        <button type="button" class="filter" data-filter="events" aria-pressed="false" data-i18n="events">Events</button>
        <button type="button" class="filter" data-filter="wedding" aria-pressed="false" data-i18n="wedding">Wedding</button>
        <button type="button" class="filter" data-filter="sport" aria-pressed="false" data-i18n="sport">Sport</button>
      </div>
    </div>
  </header>

  <main>
    <!--
      PHOTOS: one <figure> per photo. Copy a block to add one.
      data-tags: one or more of  portraits branding events wedding sport  (space-separated)
      See CLAUDE.md, "Adding a photo".
    -->
    <div class="gallery">
      <figure class="shot" data-tags="wedding">
        <a href="civil-wedding/" class="shot-link">
          <img src="../assets/photography/civil_wedding/photography_wedding_civil_wedding_01.jpg" alt="Hairdresser styling the bride's hair" loading="lazy" width="1080" height="1350">
          <span class="tab tab-br">
            <span data-i18n="more">More</span>
          </span>
          <span class="visually-hidden">Civil Wedding</span>
        </a>
      </figure>
      <figure class="shot" data-tags="branding">
        <a href="liquids-atelier/" class="shot-link">
          <img src="../assets/photography/liquids_atelier/photography_branding_liquids_atelier_01.jpg" alt="Liquids Atelier logo engraved on a bar counter" loading="lazy" width="1080" height="1350">
          <span class="tab tab-br">
            <span data-i18n="more">More</span>
          </span>
          <span class="visually-hidden">Liquids Atelier</span>
        </a>
      </figure>
      <figure class="shot" data-tags="portraits">
        <a href="beauty-meets-nature/" class="shot-link">
          <img src="../assets/photography/beauty_meets_nature/photography_portrait_beauty_meets_nature_01.jpg" alt="Portrait framed by green leaves" loading="lazy" width="1080" height="1080">
          <span class="tab tab-br">
            <span data-i18n="more">More</span>
          </span>
          <span class="visually-hidden">Beauty Meets Nature</span>
        </a>
      </figure>
    </div>
    <p class="gallery-empty" data-i18n="noItems" hidden>No projects in this category yet.</p>
  </main>

  <footer class="footer">
    <span>© 2026 Regula Huber</span>
    <span class="social">
      <a href="#top">Instagram</a>
      <a href="#top">Behance</a>
      <a href="#top">LinkedIn</a>
    </span>
  </footer>

</body>
</html>
